name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '9.0.x']
    name: build / .NET ${{ matrix.dotnet }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore VoiceTel.Sdk.sln

      - name: Build
        run: dotnet build VoiceTel.Sdk.sln --configuration Release --no-restore

      - name: Format check
        run: dotnet format VoiceTel.Sdk.sln --verify-no-changes --severity warn || true

      - name: Test
        run: |
          dotnet test VoiceTel.Sdk.sln \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal" \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-net${{ matrix.dotnet }}
          path: TestResults/**/*.xml
          if-no-files-found: ignore
