name: integration

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore + build
        run: dotnet build VoiceTel.Sdk.sln --configuration Release
      - name: Integration tests (read-only)
        env:
          VOICETEL_USERNAME: ${{ secrets.VOICETEL_USERNAME }}
          VOICETEL_PASSWORD: ${{ secrets.VOICETEL_PASSWORD }}
        run: |
          dotnet test VoiceTel.Sdk.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Integration" \
            --logger "console;verbosity=normal"
